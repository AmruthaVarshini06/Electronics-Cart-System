<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Product | Admin</title>
    <link rel="stylesheet" href="css/Admin.css">
</head>
<body>

<script>
if (
    !localStorage.getItem("loggedInUser") ||
    localStorage.getItem("role") !== "admin"
) {
    window.location.href = "Login.html";
}
</script>

<header class="admin-header">
    <h2>Add Product</h2>
    <button onclick="logout()">Logout</button>
</header>

<div class="admin-page">

    <main class="admin-form-container">
        <h3>New Product Details</h3>
        <p>Add a new product to your store</p>

        <form id="addProductForm">
            <input type="text" id="productName" placeholder="Product Name" required>
            <input type="number" id="productPrice" placeholder="Price" required>
            <input type="text" id="productCategory" placeholder="Category (Mobile, Laptop...)" required>
            <input type="text" id="productImage" placeholder="Image URL / path" required>

            <button type="submit">Add Product</button>
        </form>
    </main>

</div>

<script src="JavaScript/Add-Product.js"></script>
</body>
</html>
