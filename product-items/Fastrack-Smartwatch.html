<!DOCTYPE html>
<html>
    <head>
        <title>Fastrack Reflex</title>
        <link rel="stylesheet" href="../css/page.css">
    </head>
    <body>
        <div class="product-detail">
            <div class="product-image">
                <img src="../Photos/Fastrack.webp" alt="Fastrack Reflex Smartwatch">
            </div>

            <div class="product-info">
                <h1>Fastrack Reflex Smartwatch</h1>
                <div class="rating-stars" style="--rating: 4.0;">
                    <span class="stars"></span>
                    <span class="rating-value">(4.0)</span>
                </div>

                <ul class="product-features">
                    <li> Color Touch Display </li>
                    <li> Activity & Fitness Tracking </li>
                    <li> Call & Message Notifications </li>
                    <li> Water Resistant Design </li>
                    <li> Long Lasting Battery </li>
                </ul>

                <hr>

                <div class="price">
                    <span class="current">₹2,695</span>
                    <span class="old">₹6,995</span>
                    <span class="discount">61% off</span>
                </div>

                <div class="action-buttons">
                    <a href="../SmartWatch.html" class="back-btn">Back</a>

                    <button 
                    class="button add-to-cart"
                    data-id="fastrack-reflex"
                    data-name="Fastrack Reflex Smartwatch"
                    data-price="2695"
                    data-image="../Photos/Fastrack.webp">
                    Add To Cart
                    </button>

                </div>
            </div>
        </div>

        <script src="../JavaScript/cart.js"></script>
    </body>
</html>
