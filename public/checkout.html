<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Checkout – Smart Store</title>
  <link rel="stylesheet" href="/css/style.css"/>
</head>
<body>

<nav class="navbar">
  <div class="nav-container">
    <a href="/index.html" class="nav-logo">🛒 Smart<span>Store</span></a>
    <div class="nav-links">
      <a href="/cart.html" class="nav-btn">← Back to Cart</a>
    </div>
  </div>
</nav>

<div style="max-width:1100px;margin:2rem auto;padding:0 2rem;">
  <h1 style="font-size:1.8rem;font-weight:800;margin-bottom:2rem;">📦 Checkout</h1>
</div>

<div class="checkout-layout" id="checkout-wrapper">
  <div class="loader"><div class="spinner"></div></div>
</div>

<!-- Order Success Modal -->
<div class="modal-overlay" id="success-modal">
  <div class="modal" style="text-align:center;max-width:420px">
    <div style="font-size:4rem;margin-bottom:1rem">🎉</div>
    <h2 style="font-size:1.5rem;font-weight:800;margin-bottom:0.5rem">Order Placed!</h2>
    <p style="color:var(--text-light);margin-bottom:1.5rem">Your order has been placed successfully. We'll send updates shortly.</p>
    <div id="order-id-display" style="background:#f3f4f6;border-radius:10px;padding:0.8rem;font-size:0.85rem;margin-bottom:1.5rem;font-family:monospace"></div>
    <a href="/orders.html" class="btn btn-primary" style="display:inline-block;width:100%;margin-bottom:0.6rem">📦 View My Orders</a>
    <a href="/index.html" style="display:block;color:var(--primary);font-size:0.9rem">Continue Shopping</a>
  </div>
</div>

<script src="/js/utils.js"></script>
<script>
  let cartData = [];
  let selectedPayment = 'COD';

  async function loadCheckout() {
    const wrapper = document.getElementById('checkout-wrapper');
    if (!isLoggedIn()) { window.location.href = '/login.html'; return; }
    try {
      cartData = await apiFetch('/cart');
      if (!cartData.length) { window.location.href = '/cart.html'; return; }
      renderCheckout();
    } catch (err) {
      wrapper.innerHTML = `<div class="empty-state"><div class="icon">😕</div><h3>${err.message}</h3></div>`;
    }
  }

  function renderCheckout() {
    const subtotal = cartData.reduce((s, i) => s + i.product.price * i.quantity, 0);
    const shipping = subtotal > 50000 ? 0 : 299;
    const total = subtotal + shipping;
    const user = getUser();

    document.getElementById('checkout-wrapper').innerHTML = `
    <div class="checkout-form-card">
      <div class="checkout-section-title">📍 Shipping Address</div>
      <form id="checkout-form">
        <div class="form-row">
          <div class="form-group"><label>Full Name</label><input type="text" id="fullName" value="${user ? user.name : ''}" required placeholder="Full Name"/></div>
          <div class="form-group"><label>Phone Number</label><input type="tel" id="phone" required placeholder="10-digit number"/></div>
        </div>
        <div class="form-group"><label>Address</label><textarea id="address" rows="2" required placeholder="Street address, area…" style="width:100%;padding:0.75rem;border:2px solid var(--border);border-radius:10px;font-size:0.9rem;resize:vertical"></textarea></div>
        <div class="form-row">
          <div class="form-group"><label>City</label><input type="text" id="city" required placeholder="City"/></div>
          <div class="form-group"><label>State</label><input type="text" id="state" required placeholder="State"/></div>
        </div>
        <div class="form-group" style="max-width:200px"><label>Pincode</label><input type="text" id="pincode" required placeholder="6-digit pincode" maxlength="6"/></div>

        <div class="checkout-section-title" style="margin-top:1.5rem">💳 Payment Method</div>
        <div class="payment-option selected" id="pay-cod" onclick="selectPayment('COD')">
          <span style="font-size:1.4rem">💵</span>
          <div><div style="font-weight:700">Cash on Delivery</div><div style="font-size:0.78rem;color:var(--text-light)">Pay when order arrives</div></div>
        </div>
        <div class="payment-option" id="pay-upi" onclick="selectPayment('UPI')">
          <span style="font-size:1.4rem">📱</span>
          <div><div style="font-weight:700">UPI / Net Banking</div><div style="font-size:0.78rem;color:var(--text-light)">Pay via UPI, IMPS, NEFT</div></div>
        </div>
        <div class="payment-option" id="pay-card" onclick="selectPayment('Card')">
          <span style="font-size:1.4rem">💳</span>
          <div><div style="font-weight:700">Credit / Debit Card</div><div style="font-size:0.78rem;color:var(--text-light)">Visa, Mastercard, RuPay</div></div>
        </div>

        <button type="submit" class="btn-checkout" style="margin-top:1.5rem" id="place-btn">✅ Place Order</button>
      </form>
    </div>

    <div class="checkout-summary">
      <div class="checkout-section-title">🛍 Order Summary (${cartData.length} items)</div>
      ${cartData.map(i => `
        <div class="order-item-row">
          <span>${i.product.name} × ${i.quantity}</span>
          <span style="font-weight:700">${formatPrice(i.product.price * i.quantity)}</span>
        </div>`).join('')}
      <div style="border-top:2px solid var(--border);margin-top:0.8rem;padding-top:0.8rem">
        <div class="order-item-row"><span>Subtotal</span><span>${formatPrice(subtotal)}</span></div>
        <div class="order-item-row"><span>Shipping</span><span>${shipping === 0 ? '<span style="color:var(--success)">FREE</span>' : formatPrice(shipping)}</span></div>
        <div class="order-item-row" style="font-size:1rem;font-weight:800;color:var(--primary)"><span>Total</span><span>${formatPrice(total)}</span></div>
      </div>
    </div>`;

    document.getElementById('checkout-form').addEventListener('submit', (e) => { e.preventDefault(); placeOrder(total); });
  }

  function selectPayment(method) {
    selectedPayment = method;
    ['COD','UPI','Card'].forEach(m => document.getElementById(`pay-${m.toLowerCase()}`)?.classList.remove('selected'));
    document.getElementById(`pay-${method.toLowerCase()}`)?.classList.add('selected');
  }

  async function placeOrder(total) {
    const btn = document.getElementById('place-btn');
    btn.textContent = 'Placing order…'; btn.disabled = true;
    try {
      const items = cartData.map(i => ({ product: i.product._id, name: i.product.name, price: i.product.price, quantity: i.quantity, image: i.product.image }));
      const order = await apiFetch('/orders', {
        method: 'POST',
        body: JSON.stringify({
          items, totalAmount: total, paymentMethod: selectedPayment,
          shippingAddress: {
            fullName: document.getElementById('fullName').value,
            phone: document.getElementById('phone').value,
            address: document.getElementById('address').value,
            city: document.getElementById('city').value,
            state: document.getElementById('state').value,
            pincode: document.getElementById('pincode').value
          }
        })
      });
      cartData = [];
      document.getElementById('order-id-display').textContent = `Order ID: ${order._id}`;
      document.getElementById('success-modal').classList.add('open');
      updateCartCount();
    } catch (err) {
      showToast(err.message, 'error');
      btn.textContent = '✅ Place Order'; btn.disabled = false;
    }
  }

  loadCheckout();
</script>
</body>
</html>
