<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign Up – Smart Store</title>
  <link rel="stylesheet" href="/css/style.css"/>
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">🛒 Smart<span>Store</span></div>
    <div class="auth-subtitle">Create your free account today</div>

    <form id="signup-form">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="name" placeholder="John Doe" required/>
      </div>
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="email" placeholder="you@example.com" required/>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="Min 6 characters" required minlength="6"/>
      </div>
      <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" id="confirm" placeholder="Repeat password" required/>
      </div>
      <div id="form-msg" class="form-error" style="display:none"></div>
      <button type="submit" class="btn-auth" id="signup-btn">🚀 Create Account</button>
    </form>

    <div class="auth-switch">
      Already have an account? <a href="/login.html">Login</a>
    </div>
  </div>
</div>
<script src="/js/utils.js"></script>
<script>
  if (isLoggedIn()) window.location.href = '/index.html';

  document.getElementById('signup-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('signup-btn');
    const msg = document.getElementById('form-msg');
    msg.style.display = 'none';

    const password = document.getElementById('password').value;
    const confirm = document.getElementById('confirm').value;
    if (password !== confirm) {
      msg.textContent = 'Passwords do not match.'; msg.style.display = 'block'; return;
    }

    btn.textContent = 'Creating account…'; btn.disabled = true;
    try {
      const data = await apiFetch('/auth/signup', {
        method: 'POST',
        body: JSON.stringify({
          name: document.getElementById('name').value,
          email: document.getElementById('email').value,
          password
        })
      });
      localStorage.setItem('token', data.token);
      localStorage.setItem('user', JSON.stringify(data.user));
      showToast('Account created! Welcome 🎉', 'success');
      setTimeout(() => window.location.href = '/index.html', 800);
    } catch (err) {
      msg.textContent = err.message; msg.style.display = 'block';
      btn.textContent = '🚀 Create Account'; btn.disabled = false;
    }
  });
</script>
</body>
</html>
