<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cart – Smart Store</title>
  <link rel="stylesheet" href="/css/style.css"/>
</head>
<body>

<nav class="navbar">
  <div class="nav-container">
    <a href="/index.html" class="nav-logo">🛒 Smart<span>Store</span></a>
    <div class="nav-search">
      <input type="text" id="search-input" placeholder="Search products…"/>
      <button id="search-btn">🔍</button>
    </div>
    <div class="nav-links">
      <a href="/cart.html" class="nav-btn">🛒 Cart <span class="cart-badge" id="cart-count">0</span></a>
      <div id="auth-links"></div>
    </div>
  </div>
</nav>

<div style="max-width:1100px;margin:2rem auto;padding:0 2rem;">
  <div style="display:flex;align-items:center;gap:0.5rem;margin-bottom:1.5rem;">
    <a href="/index.html" style="color:var(--primary)">Home</a>
    <span style="color:var(--text-light)">›</span>
    <span>Shopping Cart</span>
  </div>
  <h1 style="font-size:1.8rem;font-weight:800;margin-bottom:2rem;">🛒 Shopping Cart</h1>
</div>

<div class="cart-layout" id="cart-wrapper">
  <div class="loader"><div class="spinner"></div></div>
</div>

<script src="/js/utils.js"></script>
<script>
  let cartData = [];

  async function loadCart() {
    const wrapper = document.getElementById('cart-wrapper');
    if (!isLoggedIn()) {
      wrapper.innerHTML = `<div class="empty-state" style="grid-column:1/-1"><div class="icon">🔐</div><h3>Please login to view your cart</h3><p>Login or create an account to continue shopping.</p><a href="/login.html" class="btn btn-primary">Login</a></div>`;
      return;
    }
    try {
      cartData = await apiFetch('/cart');
      renderCart();
    } catch (err) {
      wrapper.innerHTML = `<div class="empty-state" style="grid-column:1/-1"><div class="icon">😕</div><h3>Failed to load cart</h3><p>${err.message}</p></div>`;
    }
  }

  function renderCart() {
    const wrapper = document.getElementById('cart-wrapper');
    if (!cartData.length) {
      wrapper.innerHTML = `<div class="empty-state" style="grid-column:1/-1"><div class="icon">🛒</div><h3>Your cart is empty</h3><p>Browse our products and add items to cart.</p><a href="/index.html" class="btn btn-primary">Start Shopping</a></div>`;
      return;
    }

    const subtotal = cartData.reduce((s, i) => s + i.product.price * i.quantity, 0);
    const shipping = subtotal > 50000 ? 0 : 299;
    const total = subtotal + shipping;

    wrapper.innerHTML = `
      <div class="cart-items-list">
        <h3 style="font-size:1.1rem;font-weight:800;margin-bottom:1rem;">Items (${cartData.length})</h3>
        ${cartData.map(item => cartItemHTML(item)).join('')}
      </div>
      <div class="cart-total-card">
        <h3>Order Summary</h3>
        <div class="total-row"><span>Subtotal (${cartData.reduce((s,i)=>s+i.quantity,0)} items)</span><span>${formatPrice(subtotal)}</span></div>
        <div class="total-row"><span>Shipping</span><span>${shipping === 0 ? '<span style="color:var(--success)">FREE</span>' : formatPrice(shipping)}</span></div>
        ${shipping > 0 ? `<div style="font-size:0.75rem;color:var(--text-light);margin-top:-0.3rem">Add ₹${(50000-subtotal).toLocaleString('en-IN')} more for free shipping</div>` : ''}
        <div class="total-row grand" style="margin-top:0.8rem;padding-top:0.8rem;border-top:2px solid var(--border)"><span>Total</span><span>${formatPrice(total)}</span></div>
        <button class="btn-checkout" onclick="window.location.href='/checkout.html'">Proceed to Checkout →</button>
        <a href="/index.html" style="display:block;text-align:center;margin-top:0.8rem;font-size:0.85rem;color:var(--primary);">← Continue Shopping</a>
      </div>`;
  }

  function cartItemHTML(item) {
    const p = item.product;
    const catIcon = { mobiles: '📱', laptops: '💻', smartwatches: '⌚', audio: '🎧' }[p.category] || '🛒';
    return `
    <div class="cart-item">
      <div>
        ${p.image
          ? `<img src="${p.image}" alt="${p.name}" style="width:90px;height:75px;object-fit:cover;border-radius:10px;" onerror="this.outerHTML='<div style=width:90px;height:75px;display:flex;align-items:center;justify-content:center;background:#f3f4f6;border-radius:10px;font-size:2rem>${catIcon}</div>'">`
          : `<div style="width:90px;height:75px;display:flex;align-items:center;justify-content:center;background:#f3f4f6;border-radius:10px;font-size:2rem">${catIcon}</div>`}
      </div>
      <div>
        <div class="cart-item-brand">${p.brand}</div>
        <div class="cart-item-name">${p.name}</div>
        <div class="cart-item-price">${formatPrice(p.price)}</div>
        <div class="cart-item-controls">
          <button class="qty-sm" onclick="updateQty('${p._id}', ${item.quantity - 1})">−</button>
          <span class="qty-num">${item.quantity}</span>
          <button class="qty-sm" onclick="updateQty('${p._id}', ${item.quantity + 1})">+</button>
        </div>
      </div>
      <div style="text-align:right">
        <div style="font-weight:800;color:var(--dark)">${formatPrice(p.price * item.quantity)}</div>
        <button class="remove-item" onclick="removeItem('${p._id}')" style="margin-top:0.5rem;display:block">🗑 Remove</button>
      </div>
    </div>`;
  }

  async function updateQty(productId, qty) {
    try {
      cartData = await apiFetch(`/cart/${productId}`, { method: 'PUT', body: JSON.stringify({ quantity: qty }) });
      renderCart(); updateCartCount();
    } catch (err) { showToast(err.message, 'error'); }
  }

  async function removeItem(productId) {
    try {
      cartData = await apiFetch(`/cart/${productId}`, { method: 'DELETE' });
      showToast('Item removed from cart', 'info');
      renderCart(); updateCartCount();
    } catch (err) { showToast(err.message, 'error'); }
  }

  loadCart();
</script>
</body>
</html>
