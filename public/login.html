<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login – Smart Store</title>
  <link rel="stylesheet" href="/css/style.css"/>
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">🛒 Smart<span>Store</span></div>
    <div class="auth-subtitle">Welcome back! Login to your account</div>

    <form id="login-form">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="email" placeholder="you@example.com" required/>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="Enter password" required/>
      </div>
      <div id="form-msg" class="form-error" style="display:none"></div>
      <button type="submit" class="btn-auth" id="login-btn">🔐 Login</button>
    </form>

    <div class="auth-switch">
      Don't have an account? <a href="/signup.html">Sign Up</a>
    </div>
    <div style="text-align:center;margin-top:0.8rem;font-size:0.8rem;color:var(--text-light);">
      Admin? <a href="/admin/login.html" style="color:var(--primary);font-weight:600;">Admin Login →</a>
    </div>
  </div>
</div>
<script src="/js/utils.js"></script>
<script>
  if (isLoggedIn()) window.location.href = '/index.html';

  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('login-btn');
    const msg = document.getElementById('form-msg');
    btn.textContent = 'Logging in…'; btn.disabled = true;
    msg.style.display = 'none';
    try {
      const data = await apiFetch('/auth/login', {
        method: 'POST',
        body: JSON.stringify({
          email: document.getElementById('email').value,
          password: document.getElementById('password').value
        })
      });
      localStorage.setItem('token', data.token);
      localStorage.setItem('user', JSON.stringify(data.user));
      showToast('Login successful! 🎉', 'success');
      setTimeout(() => window.location.href = '/index.html', 800);
    } catch (err) {
      msg.textContent = err.message; msg.style.display = 'block';
      btn.textContent = '🔐 Login'; btn.disabled = false;
    }
  });
</script>
</body>
</html>
