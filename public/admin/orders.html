<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Manage Orders – Admin</title>
  <link rel="stylesheet" href="/css/style.css"/>
</head>
<body>

<div class="admin-layout">
  <aside class="admin-sidebar">
    <div class="logo">⚙️ Smart<span>Store</span></div>
    <nav class="admin-nav">
      <a href="/admin/dashboard.html">📊 Dashboard</a>
      <a href="/admin/products.html">🛍 Products</a>
      <a href="/admin/orders.html" class="active">📦 Orders</a>
      <a href="/index.html" target="_blank">🌐 View Store</a>
      <a href="#" onclick="adminLogout()">🚪 Logout</a>
    </nav>
  </aside>

  <main class="admin-main">
    <div class="admin-header">
      <h1>📦 Order Management</h1>
    </div>

    <!-- Filters -->
    <div style="background:#fff;border-radius:12px;padding:1rem 1.5rem;margin-bottom:1.5rem;box-shadow:var(--shadow);display:flex;gap:1rem;flex-wrap:wrap;align-items:center">
      <select id="filter-status" style="padding:0.5rem 0.9rem;border:2px solid var(--border);border-radius:8px;font-size:0.85rem" onchange="filterOrders()">
        <option value="">All Statuses</option>
        <option value="pending">Pending</option>
        <option value="confirmed">Confirmed</option>
        <option value="shipped">Shipped</option>
        <option value="delivered">Delivered</option>
        <option value="cancelled">Cancelled</option>
      </select>
    </div>

    <div class="admin-table-card">
      <div id="orders-container"><div class="loader"><div class="spinner"></div></div></div>
    </div>
  </main>
</div>

<!-- Order Detail Modal -->
<div class="modal-overlay" id="order-modal">
  <div class="modal" style="max-width:600px">
    <div class="modal-header">
      <h2>📦 Order Details</h2>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div id="order-detail-content"></div>
  </div>
</div>

<script src="/js/utils.js"></script>
<script>
  let allOrders = [];
  function adminLogout() { logout(); window.location.href = '/admin/login.html'; }

  async function loadOrders() {
    if (!isLoggedIn() || !isAdmin()) { window.location.href = '/admin/login.html'; return; }
    try {
      allOrders = await apiFetch('/orders');
      filterOrders();
    } catch (err) { showToast(err.message, 'error'); }
  }

  function filterOrders() {
    const s = document.getElementById('filter-status').value;
    const filtered = s ? allOrders.filter(o => o.status === s) : allOrders;
    renderOrders(filtered);
  }

  const statusColor = { pending:'warning', confirmed:'info', shipped:'info', delivered:'success', cancelled:'danger' };

  function renderOrders(orders) {
    document.getElementById('orders-container').innerHTML = orders.length ? `
      <div style="padding:0.8rem 1.5rem;border-bottom:1px solid var(--border);font-size:0.82rem;color:var(--text-light)">${orders.length} orders</div>
      <div style="overflow-x:auto">
      <table class="admin-table">
        <thead><tr><th>Order ID</th><th>Customer</th><th>Items</th><th>Amount</th><th>Payment</th><th>Status</th><th>Date</th><th>Actions</th></tr></thead>
        <tbody>${orders.map(o => `
          <tr>
            <td style="font-family:monospace;font-size:0.78rem">${o._id.slice(-8)}</td>
            <td><div style="font-weight:600;font-size:0.88rem">${o.user?.name || 'N/A'}</div><div style="font-size:0.75rem;color:var(--text-light)">${o.user?.email || ''}</div></td>
            <td>${o.items.length} item(s)</td>
            <td style="font-weight:700">${formatPrice(o.totalAmount)}</td>
            <td><span class="badge badge-info">${o.paymentMethod}</span></td>
            <td>
              <select onchange="updateStatus('${o._id}',this.value)" style="padding:3px 6px;border-radius:6px;border:2px solid var(--border);font-size:0.78rem;font-weight:600">
                ${['pending','confirmed','shipped','delivered','cancelled'].map(s =>
                  `<option value="${s}" ${o.status===s?'selected':''}>${s}</option>`).join('')}
              </select>
            </td>
            <td style="font-size:0.78rem;color:var(--text-light)">${new Date(o.createdAt).toLocaleDateString('en-IN')}</td>
            <td><button class="btn-sm btn-edit" onclick="viewOrder('${o._id}')">👁 View</button></td>
          </tr>`).join('')}</tbody>
      </table></div>` :
      '<div style="padding:3rem;text-align:center;color:var(--text-light)">No orders found.</div>';
  }

  async function updateStatus(orderId, status) {
    try {
      await apiFetch(`/orders/${orderId}/status`, { method: 'PUT', body: JSON.stringify({ status }) });
      showToast(`Status updated to "${status}"`, 'success');
      const idx = allOrders.findIndex(o => o._id === orderId);
      if (idx !== -1) allOrders[idx].status = status;
    } catch (err) { showToast(err.message, 'error'); }
  }

  function viewOrder(orderId) {
    const o = allOrders.find(x => x._id === orderId);
    if (!o) return;
    document.getElementById('order-detail-content').innerHTML = `
      <div style="margin-bottom:1rem">
        <strong>Order ID:</strong> <span style="font-family:monospace;font-size:0.85rem">${o._id}</span>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1.2rem">
        <div style="background:#f9fafb;border-radius:10px;padding:1rem">
          <div style="font-weight:700;margin-bottom:0.5rem">📍 Shipping Address</div>
          <div style="font-size:0.85rem;line-height:1.7">
            ${o.shippingAddress?.fullName || ''}<br/>
            ${o.shippingAddress?.phone || ''}<br/>
            ${o.shippingAddress?.address || ''}<br/>
            ${o.shippingAddress?.city || ''}, ${o.shippingAddress?.state || ''} - ${o.shippingAddress?.pincode || ''}
          </div>
        </div>
        <div style="background:#f9fafb;border-radius:10px;padding:1rem">
          <div style="font-weight:700;margin-bottom:0.5rem">💳 Payment</div>
          <div style="font-size:0.85rem">${o.paymentMethod}</div>
          <div style="font-weight:700;margin-top:0.5rem">📊 Status</div>
          <span class="badge badge-${statusColor[o.status]}">${o.status}</span>
          <div style="font-weight:700;margin-top:0.5rem">📅 Date</div>
          <div style="font-size:0.85rem">${new Date(o.createdAt).toLocaleString('en-IN')}</div>
        </div>
      </div>
      <div style="font-weight:700;margin-bottom:0.5rem">🛍 Items Ordered</div>
      ${o.items.map(item => `
        <div style="display:flex;justify-content:space-between;padding:0.5rem 0;border-bottom:1px solid var(--border);font-size:0.88rem">
          <span>${item.name} × ${item.quantity}</span>
          <span style="font-weight:700">${formatPrice(item.price * item.quantity)}</span>
        </div>`).join('')}
      <div style="display:flex;justify-content:space-between;margin-top:0.8rem;padding-top:0.8rem;border-top:2px solid var(--border);font-size:1rem;font-weight:800;color:var(--primary)">
        <span>Total Amount</span><span>${formatPrice(o.totalAmount)}</span>
      </div>`;
    document.getElementById('order-modal').classList.add('open');
  }

  function closeModal() { document.getElementById('order-modal').classList.remove('open'); }
  document.getElementById('order-modal').addEventListener('click', e => { if (e.target === e.currentTarget) closeModal(); });

  loadOrders();
</script>
</body>
</html>
