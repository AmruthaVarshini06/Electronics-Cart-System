<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Login – Smart Store</title>
  <link rel="stylesheet" href="/css/style.css"/>
</head>
<body>
<div class="auth-page" style="background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%)">
  <div class="auth-card">
    <div style="text-align:center;font-size:2.5rem;margin-bottom:0.5rem">⚙️</div>
    <div class="auth-logo">Admin <span>Panel</span></div>
    <div class="auth-subtitle">SmartStore Administration</div>

    <form id="admin-login-form">
      <div class="form-group">
        <label>Admin Email</label>
        <input type="email" id="email" placeholder="admin@smartstore.com" required/>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="Admin password" required/>
      </div>
      <div id="form-msg" class="form-error" style="display:none"></div>
      <button type="submit" class="btn-auth" id="login-btn">🔐 Admin Login</button>
    </form>
    <div style="text-align:center;margin-top:1rem;font-size:0.82rem;color:var(--text-light)">
      Default: admin@smartstore.com / admin123
    </div>
    <div class="auth-switch"><a href="/index.html">← Back to Store</a></div>
  </div>
</div>
<script src="/js/utils.js"></script>
<script>
  document.getElementById('admin-login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('login-btn');
    const msg = document.getElementById('form-msg');
    btn.textContent = 'Logging in…'; btn.disabled = true; msg.style.display = 'none';
    try {
      const data = await apiFetch('/auth/admin-login', {
        method: 'POST',
        body: JSON.stringify({ email: document.getElementById('email').value, password: document.getElementById('password').value })
      });
      if (data.user.role !== 'admin') throw new Error('Not an admin account');
      localStorage.setItem('token', data.token);
      localStorage.setItem('user', JSON.stringify(data.user));
      window.location.href = '/admin/dashboard.html';
    } catch (err) {
      msg.textContent = err.message; msg.style.display = 'block';
      btn.textContent = '🔐 Admin Login'; btn.disabled = false;
    }
  });
</script>
</body>
</html>
