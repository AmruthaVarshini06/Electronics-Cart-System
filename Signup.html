<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Signup | Smart Store</title>
    <link rel="stylesheet" href="css/Login.css">
</head>
<body>

<div class="page-wrapper">
    <section class="video-container">
        <video autoplay muted loop playsinline>
            <source src="Videos/Loginpagebg3.mp4" type="video/mp4">
        </video>
    </section>

    <div class="login-container">
        <h1>Smart Store</h1>
        <p class="subtitle">Create an account</p>

        <input type="email" id="signupEmail" placeholder="Email address" required>
        <input type="password" id="signupPassword" placeholder="Password" required>

        <button onclick="signup('user')">Sign up as User</button>
        <button onclick="signup('admin')">Sign up as Admin</button>

        <p class="extra">
            Already have an account?
            <a href="Login.html">Login</a>
        </p>
    </div>
</div>

<script src="JavaScript/Signup.js"></script>
</body>
</html>
